[build]
  functions = "netlify/functions"
  publish = "public"
  command = "npm ci && node -e \"require('fs').writeFileSync('src/build-info.json', JSON.stringify({ build: (process.env.COMMIT_REF||'').slice(0,7) }))\""

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[functions."server"]
  external_node_modules = ["pg", "ejs"]
  included_files = ["views/**", "public/**", "src/views/**", "src/public/**", "server.js"]

[functions."scheduled-broadcast-runner"]
  schedule = "*/5 * * * *"

# 每月 1 號 03:30 UTC = 台北 11:30，觸發訂位熱榜推播
[functions."scheduled-monthly-leaderboard"]
  schedule = "30 3 1 * *"

# 每 5 分鐘推進圖文選單與活動上下架。
[functions."scheduled-richmenu-runner"]
  schedule = "4-59/5 * * * *"

# 每分鐘推進自動化流程引擎，讓「點圖文選單後延遲推播」維持約 1 分鐘精度。
[functions."scheduled-flow-runner"]
  schedule = "* * * * *"

[[redirects]]
  from = "/style.css"
  to = "/style.css"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
